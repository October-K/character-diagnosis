function makeEngine(data){

 const zeros=()=>keys.map(()=>0);
 const maxima={receive:zeros(),give:zeros(),similar:zeros()};
 data.questions.forEach(q=>keys.forEach((k,j)=>{
  maxima[q.group][j]+=Math.max(...q.options.map(o=>o.match[k]||0));
  if(q.group==='give')maxima.similar[j]+=Math.max(...q.options.map(o=>o.similar[k]||0));
 }));
 if(Object.values(maxima).some(a=>a.some(v=>v<=0)))throw Error('判定用の最高点が不足しています。');
 function calculate(answers){
  if(!Array.isArray(answers)||answers.length!==data.questions.length||Array.from(answers).some((a,i)=>!Number.isInteger(a)||a<0||a>=data.questions[i].options.length))throw Error('すべての質問に回答してください。');
  const raw={receive:zeros(),give:zeros(),similar:zeros()},conflicts=[];
  data.questions.forEach((q,i)=>{
   const o=q.options[answers[i]];
   keys.forEach((k,j)=>{raw[q.group][j]+=o.match[k]||0;if(q.group==='give')raw.similar[j]+=o.similar[k]||0;});
   Object.entries(o.conflicts||{}).forEach(([key,reason])=>{if(keys.includes(key))conflicts.push({key,reason,index:i,text:o.text});});
  });
  const excluded=[...new Set(conflicts.map(c=>c.key))];
  const eligible=keys.map((_,j)=>j).filter(j=>!excluded.includes(keys[j]));
  const ratios=keys.map((_,j)=>({num:weights.receive*raw.receive[j]*maxima.give[j]+weights.give*raw.give[j]*maxima.receive[j],den:maxima.receive[j]*maxima.give[j]}));
  function compare(a,b){const diff=ratios[a].num*ratios[b].den-ratios[b].num*ratios[a].den;return diff||raw.give[a]*maxima.give[b]-raw.give[b]*maxima.give[a];}
  let best=eligible[0],simBest=0;
  eligible.forEach(j=>{if(compare(j,best)>0)best=j;});
  keys.forEach((_,j)=>{if(raw.similar[j]*maxima.similar[simBest]>raw.similar[simBest]*maxima.similar[j])simBest=j;});
  const winners=eligible.filter(j=>compare(j,best)===0).map(j=>keys[j]);
  const similar=keys.filter((_,j)=>raw.similar[j]*maxima.similar[simBest]===raw.similar[simBest]*maxima.similar[j]);
  return {winners,similar,raw,maxima,weights,conflicts,excluded};
 }
 function reasons(answers,key){
  return ['give','receive'].map(group=>{
   const list=data.questions.flatMap((q,i)=>q.group===group&&Number.isInteger(answers[i])?[{index:i,text:q.options[answers[i]].text,points:q.options[answers[i]].match[key]||0,group}]:[]).filter(x=>x.points>0).sort((a,b)=>b.points-a.points||a.index-b.index);
   return list[0]||null;
  }).filter(Boolean);
 }
 return {calculate,reasons,maxima,weights};
}
root.CharacterQuiz={makeEngine};
if(typeof module!=='undefined')module.exports={makeEngine};
})(typeof window!=='undefined'?window:globalThis);
</script>
<script>'use strict';
const DATA=window.CHARACTER_DATA;
const engine=CharacterQuiz.makeEngine(DATA);
const byId=Object.fromEntries(DATA.characters.map(c=>[c.id,c]));
const app=document.getElementById('app');
let answers=Array(DATA.questions.length).fill(null),step=0,resultKey=null,screen='quiz';
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function portrait(key,extra=''){const c=byId[key];return `<div class="portrait ${extra}" style="--portrait-top:${c.portraitTop};--character-color:${c.color}"><img data-portrait="${key}" data-src="${c.image}" alt="${e(c.name)}のイラスト" width="377" height="503"></div>`;}
function focusTitle(){requestAnimationFrame(()=>{document.querySelector('[data-focus]')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});});}
function quiz(focus=false){
 screen='quiz';document.title='あなたと相性のいいキャラ診断';
 const q=DATA.questions[step],answered=answers.filter(x=>x!==null).length;
 app.innerHTML=`<section class="intro"><div><p class="eyebrow">FIND YOUR COMPANION</p><h1>あなたと相性のいい<br class="mobile-break">キャラ診断</h1></div><p class="intro-copy">求めること。返せること。<br>長く、心地よく過ごせる関係を。</p></section>
 <div class="quiz-layout"><aside class="journey-panel"><div class="journey-visual"><p class="eyebrow">POKÉSPE / NEXT GENERATION</p><p class="display-word" aria-hidden="true">A NEW<br><em>CONNECTION.</em></p><div class="portrait-cluster">${portrait('kyanite','cluster-left')}${portrait('orange','cluster-center')}${portrait('cornelpin','cluster-right')}</div><div class="journey-caption"><span>10 CHARACTERS</span><p>まだ知らない、<br>二人の距離を見つけよう。</p></div></div><div class="record"><span class="eyebrow">YOUR PROGRESS</span><span><b id="answered-count">${String(answered).padStart(2,'0')}</b> / 12</span></div><div id="progress" class="progress" role="progressbar" aria-label="回答済みの質問" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${answered}">${answers.map((a,i)=>`<span class="${a!==null?'answered':''} ${i===step?'current':''}"></span>`).join('')}</div><div class="chapter-list"><div class="${q.group==='receive'?'active':''}"><span>01</span>あなたが求める関わり</div><div class="${q.group==='give'?'active':''}"><span>02</span>相手へ返せる関わり</div></div><p class="sidebar-note">「こうあるべき」より、<br>無理なくできることを選んでね。</p></aside>
 <section class="question-panel"><div class="question-meta"><span class="eyebrow">QUESTION <b>${String(step+1).padStart(2,'0')}</b><span class="slash">/ 12</span></span><span class="category">${q.group==='receive'?'求める関わり':'返せる関わり'}</span></div><h2 id="question-title" tabindex="-1" data-focus>${q.title}</h2><p class="choice-hint">いちばん近いものを、1つ選んでください。</p><fieldset class="options"><legend class="sr-only">${q.title}</legend>${q.options.map((o,a)=>`<label class="option ${answers[step]===a?'selected':''}"><input type="radio" name="answer" value="${a}" ${answers[step]===a?'checked':''}><span class="letter">${'ABCD'[a]}</span><span class="option-text">${e(o.text)}</span><span class="option-mark" aria-hidden="true">${answers[step]===a?'✓':'＋'}</span></label>`).join('')}</fieldset><div class="question-controls"><button class="text-button" id="back" ${step===0?'disabled':''}><span aria-hidden="true">←</span>前の質問</button><button class="primary" id="next" ${answers[step]===null?'disabled':''}>${step===11?'結果を見る':'次の質問へ'}<span aria-hidden="true">→</span></button></div><p class="question-foot">${step===11?'これが最後の質問です。二人の関係を見てみよう。':'正解・不正解はありません。今のあなたの感覚で。'}</p></section></div>`;
 document.querySelectorAll('input[name="answer"]').forEach(input=>input.addEventListener('change',()=>{
  answers[step]=Number(input.value);
  document.querySelectorAll('.option').forEach(label=>{const chosen=Number(label.querySelector('input').value)===answers[step];label.classList.toggle('selected',chosen);label.querySelector('.option-mark').textContent=chosen?'✓':'＋';});
  document.getElementById('next').disabled=false;const count=answers.filter(x=>x!==null).length;
  document.getElementById('answered-count').textContent=String(count).padStart(2,'0');document.getElementById('progress').setAttribute('aria-valuenow',String(count));document.querySelectorAll('.progress span').forEach((bar,i)=>bar.classList.toggle('answered',answers[i]!==null));
 }));
 document.getElementById('back').addEventListener('click',()=>{if(step>0){step--;quiz(true);}});
 document.getElementById('next').addEventListener('click',()=>{if(answers[step]===null)return;if(step<11){step++;quiz(true);}else{resultKey=null;result(true);}});
 if(window.loadPortraits)window.loadPortraits(app);
 if(focus)focusTitle();
}
function result(focus=false){
 const scored=engine.calculate(answers);screen='result';if(!scored.winners.length){app.innerHTML='<section class="result"><h1 tabindex="-1" data-focus>今の回答では、おすすめを一人に選べませんでした。</h1><p>関係の中で大切にしたいことを、もう一度振り返ってみよう。</p><button class="primary" id="review">回答を見直す</button></section>';document.getElementById('review').addEventListener('click',()=>{step=0;quiz(true);});if(focus)focusTitle();return;}if(!scored.winners.includes(resultKey))resultKey=scored.winners[0];
 const c=byId[resultKey],reasons=engine.reasons(answers,resultKey);
 document.title=`${c.name}｜あなたと相性のいいキャラ診断`;
 app.innerHTML=`<section class="result" style="--character-color:${c.color}"><div class="result-heading"><p class="eyebrow">YOUR BEST MATCH</p><h1 id="question-title" tabindex="-1" data-focus>${scored.winners.length>1?'いくつかの、心地よい関係が見つかりました。':'あなたと、長く心地よく過ごせそうなのは。'}</h1>${scored.winners.length>1?`<p class="muted">同率のおすすめです。それぞれの関係を見てみよう。</p><div class="match-switch" aria-label="同率のおすすめ">${scored.winners.map(k=>`<button data-character="${k}" class="${k===resultKey?'active':''}" aria-pressed="${k===resultKey}">${byId[k].name}</button>`).join('')}</div>`:''}</div>
 <div class="result-card"><section class="identity-panel"><div class="identity-top"><span class="eyebrow">${c.region}</span><span class="record-number">FILE ${String(DATA.keys.indexOf(resultKey)+1).padStart(2,'0')}</span></div>${portrait(c.id,'result-portrait')}<p class="identity-label">YOUR COMPANION</p><h2>${c.name}</h2><p class="epithet">${c.epithet}</p><div class="identity-tags">${c.tags.map(t=>`<span>${t}</span>`).join('')}</div></section><section class="relationship"><p class="eyebrow">THE TWO OF YOU</p><h3>${c.headline}</h3><p class="relation-intro">${c.relation}</p><div class="give-and-receive"><section><span class="detail-number">01 / FOR THEM</span><h4>相手が心地よく過ごせる理由</h4><p>${c.give}</p></section><section><span class="detail-number">02 / FOR YOU</span><h4>あなたが受け取れるもの</h4><p>${c.receive}</p></section><section><span class="detail-number">03 / TRUST</span><h4>信頼が深まるきっかけ</h4><p>${c.trust}</p></section></div></section></div>
 <section class="boundary-panel"><div><p class="eyebrow">WHAT MATTERS TO THEM</p><h3>このキャラが譲れないこと</h3></div><div><p class="boundary-main">${e(c.boundary)}</p><p class="boundary-detail">${e(c.boundaryDetail)}</p>${c.scopeNote?`<p class="scope-note">${e(c.scopeNote)}</p>`:''}</div></section>
 <div class="result-secondary"><section class="friction-panel"><p class="eyebrow">TO GROW CLOSER</p><h3>すれ違いやすいところ</h3><p>${c.friction}</p><div class="tip"><span aria-hidden="true">＋</span><p>${c.tip}</p></div></section><section class="reasons-panel"><p class="eyebrow">FROM YOUR ANSWERS</p><h3>この回答が、関係のヒント。</h3>${reasons.map(r=>`<div class="reason"><span>Q${String(r.index+1).padStart(2,'0')}<small>${r.group==='receive'?'求める関わり':'返せる関わり'}</small></span><p>${e(r.text)}</p></div>`).join('')}<p class="small-note">回答とキャラクター設定に、こうした接点がありました。</p></section></div>
 ${scored.conflicts.length?`<details class="conflict-note"><summary>回答と、ほかのキャラとのすれ違い</summary>${scored.conflicts.map(x=>`<p><strong>${e(byId[x.key].name)}</strong>：${e(x.reason)}</p><p class="small-note">Q${x.index+1}「${e(x.text)}」から。</p>`).join('')}</details>`:''}
 <section class="similar-panel"><div class="similar-intro"><p class="eyebrow">MOST LIKE YOU</p><h3>あなたに似ているキャラ</h3><p>「自分がどう関わるか」の回答から。</p></div><div class="similar-list">${scored.similar.map(k=>`<div class="similar-person" style="--character-color:${byId[k].color}">${portrait(k,'small-portrait')}<div><h4>${byId[k].name}${scored.similar.length>1?'<span class="tie-label">同率</span>':''}</h4><p>${byId[k].similar}</p></div></div>`).join('')}</div></section>
 <div class="result-actions"><button class="primary" id="restart">もう一度診断する<span aria-hidden="true">↻</span></button><button class="secondary" id="review">回答を見直す</button><button class="text-button" id="copy">結果をコピー<span aria-hidden="true">↗</span></button></div><p id="copy-status" role="status" aria-live="polite" class="copy-status"></p><div id="copy-fallback" class="copy-fallback" hidden><label for="copy-text">下の文章を選択してコピーしてください。</label><textarea id="copy-text" rows="6" readonly></textarea></div><p class="disclaimer">作品の設定と回答から、関係の可能性を楽しむ診断です。性格や実際の相性を断定するものではありません。</p></section>`;
 document.querySelectorAll('[data-character]').forEach(b=>b.addEventListener('click',()=>{resultKey=b.dataset.character;result(true);}));
 document.getElementById('restart').addEventListener('click',()=>{answers=Array(12).fill(null);step=0;resultKey=null;quiz(true);});
 document.getElementById('review').addEventListener('click',()=>{step=0;quiz(true);});
 document.getElementById('copy').addEventListener('click',async()=>{
  const text=`あなたと相性のいいキャラ診断\n相性のいいキャラ：${scored.winners.map(k=>byId[k].name).join('・')}\n${c.name}との関係：${c.headline}\n似ているキャラ：${scored.similar.map(k=>byId[k].name).join('・')}\n${location.href.split('#')[0].split('?')[0]}`;
  try{if(!navigator.clipboard?.writeText)throw Error('clipboard unavailable');await navigator.clipboard.writeText(text);if(screen==='result'){document.getElementById('copy-status').textContent='結果をコピーしました。';}}
  catch{if(screen==='result'){document.getElementById('copy-fallback').hidden=false;const t=document.getElementById('copy-text');t.value=text;t.focus();t.select();document.getElementById('copy-status').textContent='下の欄からコピーできます。';}}
 });
 if(window.loadPortraits)window.loadPortraits(app);
 if(focus)focusTitle();
}
document.getElementById('logout').addEventListener('click',()=>{try{sessionStorage.removeItem('characterDiagnosisAuth');}finally{location.replace('./login.html');}});
window.addEventListener('pageshow',()=>{try{if(sessionStorage.getItem('characterDiagnosisAuth')!=='ok')location.replace('./login.html');}catch{location.replace('./login.html');}});
quiz();
</script>
</body>
