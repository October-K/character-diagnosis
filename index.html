<style>
:root{
  --bg:#0b1020;
  --panel:#121a30;
  --line:rgba(255,255,255,.14);
  --text:#f6f7fb;
  --muted:#b9c1d9;
  --gold:#f1d78a;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  background:
    radial-gradient(circle at 20% 15%, rgba(95,120,255,.17), transparent 28%),
    radial-gradient(circle at 80% 75%, rgba(240,177,255,.11), transparent 26%),
    linear-gradient(180deg,#080c18,#10152a 55%,#070a13);
  overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.45;
  background-image:
    radial-gradient(circle,white 1px,transparent 1px),
    radial-gradient(circle,white 1px,transparent 1px);
  background-size:55px 55px, 91px 91px;
  background-position:0 0,20px 15px;
}
.wrap{width:min(920px,92vw);margin:0 auto;padding:46px 0 70px}
.hero{text-align:center;margin-bottom:28px}
.kicker{letter-spacing:.25em;color:var(--gold);font-size:.78rem}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(2rem,5vw,4.2rem);margin:.15em 0}
.sub{color:var(--muted);line-height:1.8}
.panel{
  background:linear-gradient(180deg,rgba(20,29,52,.92),rgba(12,18,35,.9));
  border:1px solid var(--line); border-radius:24px; padding:24px;
  box-shadow:0 22px 70px rgba(0,0,0,.38); backdrop-filter:blur(12px);
}
.progress{display:flex;gap:8px;margin-bottom:20px}
.progress span{height:4px;flex:1;border-radius:20px;background:rgba(255,255,255,.1)}
.progress span.on{background:linear-gradient(90deg,#f6df9b,#d0b760)}
.qnum{font-size:.78rem;color:var(--gold);letter-spacing:.14em}
.question{font-size:1.35rem;line-height:1.6;margin:8px 0 20px}
.choices{display:grid;gap:12px}
.choice{
  width:100%;text-align:left;border:1px solid var(--line);color:var(--text);
  background:rgba(255,255,255,.045);padding:15px 17px;border-radius:15px;
  cursor:pointer;font-size:1rem;transition:.2s transform,.2s background,.2s border;
}
.choice:hover{transform:translateY(-2px);background:rgba(255,255,255,.085);border-color:rgba(241,215,138,.5)}
.hidden{display:none!important}
.center{text-align:center}
.summon{
  position:relative;width:210px;height:210px;margin:22px auto 8px;border-radius:50%;
  display:grid;place-items:center;
}
.summon::before,.summon::after{
  content:"";position:absolute;border:1px solid rgba(241,215,138,.55);border-radius:50%;
  animation:spin 7s linear infinite;
}
.summon::before{inset:12px}
.summon::after{inset:35px;border-style:dashed;animation-direction:reverse;animation-duration:4s}
.orb{
  width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff7d0,#e2bd55 18%,#89651d 54%,#1c1520 75%);
  box-shadow:0 0 25px #f2d170,0 0 80px rgba(231,190,77,.45);
  animation:pulse 1.4s ease-in-out infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.09);filter:brightness(1.22)}}
.card{
  margin-top:18px;border-radius:28px;padding:28px;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.17);
  background:
    radial-gradient(circle at 50% -10%, rgba(255,255,255,.18),transparent 35%),
    linear-gradient(160deg,var(--c1),var(--c2));
  box-shadow:0 28px 90px rgba(0,0,0,.42);
}
.card::after{content:"";position:absolute;inset:-40%;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.16),transparent 65%);transform:rotate(12deg);animation:shine 4s linear infinite;pointer-events:none;z-index:0}
@keyframes shine{from{translate:-50% 0}to{translate:50% 0}}
.region{position:relative;z-index:1;font-size:.78rem;letter-spacing:.2em;color:rgba(255,255,255,.76)}
.name{position:relative;z-index:1;font-family:Georgia,serif;font-size:clamp(2.2rem,7vw,4.4rem);margin:.05em 0}
.epithet{position:relative;z-index:1;color:#fff9dc;margin-bottom:22px}
.result-label{
  position:relative;z-index:1;
  display:inline-block;margin:0 auto 6px;padding:6px 12px;border-radius:999px;
  background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.2);
  font-size:.72rem;letter-spacing:.18em;color:#fff3b7
}
.result-name{
  position:relative;z-index:1;
  font-family:Georgia,"Yu Mincho",serif;
  font-size:clamp(2.8rem,8vw,5.2rem);
  font-weight:700;line-height:1.05;margin:.08em 0 .12em;
  text-shadow:0 3px 18px rgba(0,0,0,.34)
}
.compat{position:relative;z-index:1;font-size:.9rem;letter-spacing:.1em;color:#fff3b7}
.score{position:relative;z-index:1;font-size:2rem;margin:5px 0 14px}
.desc{position:relative;z-index:1;line-height:1.9;color:rgba(255,255,255,.92);max-width:720px;margin:auto}
.reason{position:relative;z-index:1;margin-top:18px;padding:14px 16px;border-radius:14px;background:rgba(0,0,0,.18);line-height:1.75}
.similar-box{
  position:relative;z-index:1;
  margin-top:20px;padding:18px;border-radius:16px;
  background:rgba(0,0,0,.20);border:1px solid rgba(255,255,255,.16);
  text-align:left
}
.similar-label{font-size:.76rem;letter-spacing:.15em;color:#fff3b7;margin-bottom:6px}
.similar-name{font-size:1.55rem;font-weight:700;margin-bottom:8px}
.similar-desc{line-height:1.75;color:rgba(255,255,255,.9)}
.actions{position:relative;z-index:2;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.btn{
  border:1px solid var(--line);background:#f3d985;color:#1a1830;font-weight:700;
  padding:13px 18px;border-radius:999px;cursor:pointer
}
.btn.secondary{background:rgba(255,255,255,.06);color:white}
.note{font-size:.82rem;color:var(--muted);margin-top:16px;text-align:center}
</style>
</head>

</div>

  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}

let i=0, scores={}, similarityScores={};
Object.keys(chars).forEach(k=>{scores[k]=0; similarityScores[k]=0;});

function render(){
 const p=document.getElementById("progress");
 p.innerHTML=questions.map((_,idx)=>`<span class="${idx<=i?'on':''}"></span>`).join("");
 document.getElementById("qnum").textContent=`QUESTION ${i+1} / ${questions.length}`;
 document.getElementById("question").textContent=questions[i].q;
 const box=document.getElementById("choices"); box.innerHTML="";
 questions[i].a.forEach(([label,pts], choiceIndex)=>{
  const b=document.createElement("button");
  b.className="choice";
  b.type="button";
  b.textContent=label;
  b.addEventListener("click",()=>choose(pts, choiceIndex));
  box.appendChild(b);
 });
}
function choose(pts, choiceIndex){
 Object.entries(pts).forEach(([k,v])=>scores[k]+=v);
 addSimilarityPoints(choiceIndex, i);
 i++;
 if(i<questions.length) render(); else summon();
}
function summon(){
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("summoning").classList.remove("hidden");
 setTimeout(showResult,1700);
}
function showResult(){
 const max=Math.max(...Object.values(scores));
 const top=Object.keys(scores).filter(k=>scores[k]===max);
 const key=top[Math.floor(Math.random()*top.length)];
 const c=chars[key];
 document.getElementById("summoning").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");

 const card=document.getElementById("resultCard");
 card.style.setProperty("--c1",c.c1);
 card.style.setProperty("--c2",c.c2);

 document.getElementById("region").textContent=c.region;
 document.getElementById("name").textContent=c.name;
 document.getElementById("epithet").textContent=c.epithet;

 const pct=Math.min(99,72+Math.round(max*1.15));
 document.getElementById("score").textContent=pct+"%";
 document.getElementById("desc").textContent=c.desc;

 const sorted=Object.entries(scores)
   .sort((a,b)=>b[1]-a[1])
   .slice(0,3)
   .map(([k])=>chars[k].name);

 document.getElementById("reason").textContent=
   `回答全体から見ると、相性候補は「${sorted.join("・")}」。その中でも、あなたが求める関係と、相手に返せる関わり方の両方が最も噛み合ったのは ${c.name} です。`;

 const simMax=Math.max(...Object.values(similarityScores));
 const simTop=Object.keys(similarityScores).filter(k=>similarityScores[k]===simMax);
 const simKey=simTop[Math.floor(Math.random()*simTop.length)];
 const sim=similarityProfiles[simKey];
 document.getElementById("similarName").textContent=sim.name;
 document.getElementById("similarDesc").textContent=sim.desc;

 window.currentResult=`あなたと相性のいいキャラは【${c.name}】！ 相性 ${pct}% — ${c.epithet}
貴方と似ているキャラは【${sim.name}】`;
}
function restart(){
 i=0;
 scores={};
 similarityScores={};
 Object.keys(chars).forEach(k=>{scores[k]=0; similarityScores[k]=0;});

 document.getElementById("result").classList.add("hidden");
 document.getElementById("summoning").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");

 document.getElementById("region").textContent="";
 document.getElementById("name").textContent="";
 document.getElementById("epithet").textContent="";
 document.getElementById("score").textContent="";
 document.getElementById("desc").textContent="";
 document.getElementById("reason").textContent="";
 document.getElementById("similarName").textContent="";
 document.getElementById("similarDesc").textContent="";
 window.currentResult="";

 render();
 window.scrollTo({top:0,behavior:"smooth"});
}
async function copyResult(){
 const value=window.currentResult||"";
 if(!value) return;
 try{
   if(navigator.clipboard && window.isSecureContext){
     await navigator.clipboard.writeText(value);
   }else{
     const ta=document.createElement("textarea");
     ta.value=value;
     ta.setAttribute("readonly","");
     ta.style.position="fixed";
     ta.style.opacity="0";
     document.body.appendChild(ta);
     ta.select();
     document.execCommand("copy");
     document.body.removeChild(ta);
   }
   alert("結果をコピーしました！");
 }catch(e){
   window.prompt("コピーしてください：", value);
 }
}
document.addEventListener("DOMContentLoaded",()=>{

 if(logoutBtn) logoutBtn.addEventListener("click",()=>{
   sessionStorage.removeItem("characterDiagnosisAuth");

 });
 const restartBtn=document.getElementById("restartBtn");
 const copyBtn=document.getElementById("copyBtn");
 if(restartBtn) restartBtn.addEventListener("click", restart);
 if(copyBtn) copyBtn.addEventListener("click", copyResult);
 render();
});
