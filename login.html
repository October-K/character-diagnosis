<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>LOGIN | あなたと相性のいいキャラ診断</title>
<style>
:root{
  --bg:#0b1020; --panel:#121a30; --line:rgba(255,255,255,.14);
  --text:#f6f7fb; --muted:#b9c1d9; --gold:#f1d78a;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  color:var(--text);
  font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  background:
    radial-gradient(circle at 20% 15%, rgba(95,120,255,.17), transparent 28%),
    radial-gradient(circle at 80% 75%, rgba(240,177,255,.11), transparent 26%),
    linear-gradient(180deg,#080c18,#10152a 55%,#070a13);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;
  background-image:
    radial-gradient(circle,white 1px,transparent 1px),
    radial-gradient(circle,white 1px,transparent 1px);
  background-size:55px 55px,91px 91px;
  background-position:0 0,20px 15px;
}
.panel{
  position:relative;z-index:1;width:min(460px,90vw);
  padding:30px;border-radius:24px;text-align:center;
  background:linear-gradient(180deg,rgba(20,29,52,.94),rgba(12,18,35,.92));
  border:1px solid var(--line);box-shadow:0 22px 70px rgba(0,0,0,.4);
}
.kicker{letter-spacing:.25em;color:var(--gold);font-size:.76rem}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:2rem;margin:.35em 0}
p{color:var(--muted);line-height:1.8}
input{
  width:100%;margin-top:14px;padding:14px 16px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.06);
  color:white;font-size:1rem;outline:none;
}
input:focus{border-color:rgba(241,215,138,.6)}
button{
  margin-top:12px;width:100%;padding:13px 18px;border:0;border-radius:999px;
  background:#f3d985;color:#1a1830;font-weight:700;cursor:pointer;font-size:1rem;
}
.error{min-height:1.5em;margin-top:10px;color:#ffb7b7;font-size:.9rem}
.note{margin-top:18px;font-size:.78rem;color:#8f97ad}
</style>
</head>
<body>
<main class="panel">
  <div class="kicker">CHARACTER DIAGNOSIS</div>
  <h1>LOGIN</h1>
  <p>合言葉を入力してください。</p>

  <form id="loginForm">
    <input id="password" type="password" autocomplete="current-password" placeholder="PASSWORD">
    <button type="submit">ENTER</button>
  </form>

  <div class="error" id="error"></div>
  <div class="note">このページは簡易的な合言葉ゲートです。</div>
</main>

<script>
/*
  ★ここを書き換えてください。
  例: const PASSWORD = "orange123";
*/
const PASSWORD = "CHANGE_ME";

const form = document.getElementById("loginForm");
const input = document.getElementById("password");
const error = document.getElementById("error");

form.addEventListener("submit",(e)=>{
  e.preventDefault();

  if(input.value === PASSWORD){
    sessionStorage.setItem("characterDiagnosisAuth","ok");
    location.href="./index.html";
  }else{
    error.textContent="合言葉が違います。";
    input.select();
  }
});
</script>
</body>
</html>
